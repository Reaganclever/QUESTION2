<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography Portfolio Slider</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="slider-container">
        <h2>MY PHOTOGRAPHY PORTOFOLIO</h2>
        
        <!-- Image Display Area -->
        <div class="slider">
            <img id="sliderImage" src="" alt="Portfolio Image">
        </div>

        <!-- Navigation Buttons -->
        <div class="buttons">
            <button id="prevBtn">Previous</button>
            <button id="nextBtn">Next</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
